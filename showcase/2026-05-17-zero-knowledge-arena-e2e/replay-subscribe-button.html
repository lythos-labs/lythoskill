<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe Button</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --border: #2a2a30;
    --accent: #d4a853;
    --accent-glow: rgba(212, 168, 83, 0.25);
    --text: #e8e4dd;
    --text-muted: #8a857d;
    --input-bg: #1a1a1e;
    --danger: #c44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    background-image:
      radial-gradient(ellipse at 50% 35%, rgba(212, 168, 83, 0.04) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 20%, rgba(212, 168, 83, 0.02) 0%, transparent 50%);
  }

  .subscribe-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 3.5rem 3rem;
    max-width: 520px;
    width: 90%;
    position: relative;
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.02) inset,
      0 24px 64px -24px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.01);
  }

  /* Decorative corner accent */
  .subscribe-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: -1px;
    width: 48px;
    height: 48px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    pointer-events: none;
  }

  .subscribe-card::after {
    content: '';
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 48px;
    height: 48px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    pointer-events: none;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }

  .heading {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 2.8rem;
    line-height: 1.05;
    color: var(--text);
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
  }

  .heading em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    line-height: 1.6;
    margin-bottom: 2.2rem;
  }

  .input-group {
    display: flex;
    gap: 0;
    position: relative;
  }

  .input-group input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-right: none;
    padding: 1rem 1.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    border-radius: 2px 0 0 2px;
  }

  .input-group input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .input-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .subscribe-btn {
    background: var(--accent);
    color: #0a0a0b;
    border: 1px solid var(--accent);
    padding: 1rem 2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 0 2px 2px 0;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }

  .subscribe-btn:hover {
    background: #c49a3e;
    border-color: #c49a3e;
    box-shadow: 0 0 32px var(--accent-glow);
    transform: translateY(-1px);
  }

  .subscribe-btn:active {
    transform: translateY(0) scale(0.98);
    transition: transform 0.08s ease;
  }

  /* Shimmer effect on hover */
  .subscribe-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.15) 50%,
      transparent 100%);
    transition: left 0.6s ease;
  }

  .subscribe-btn:hover::after {
    left: 100%;
  }

  /* Status states */
  .status-msg {
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .status-msg.visible {
    opacity: 1;
  }

  .status-msg.success {
    color: var(--accent);
  }

  .status-msg.error {
    color: var(--danger);
  }

  /* Bottom ornamental line */
  .ornament {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 2rem;
    opacity: 0.3;
  }

  .ornament .line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .ornament .diamond {
    width: 5px;
    height: 5px;
    background: var(--accent);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Accessibility */
  .subscribe-btn:focus-visible,
  .input-group input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="subscribe-card">
  <div class="label">Newsletter</div>
  <h1 class="heading">Stay <em>curious</em></h1>
  <p class="subtitle">
    Essays on design, technology, and the spaces between. Sent twice a month. No spam, ever.
  </p>

  <div class="input-group">
    <input
      type="email"
      id="email-input"
      placeholder="you@example.com"
      aria-label="Email address"
      autocomplete="email"
    >
    <button class="subscribe-btn" id="subscribe-btn" type="button">
      Subscribe
    </button>
  </div>

  <p class="status-msg" id="status-msg" aria-live="polite"></p>

  <div class="ornament">
    <span class="line"></span>
    <span class="diamond"></span>
    <span class="line"></span>
  </div>
</div>

<script>
  const btn = document.getElementById('subscribe-btn');
  const input = document.getElementById('email-input');
  const status = document.getElementById('status-msg');

  function showStatus(msg, type) {
    status.textContent = msg;
    status.className = 'status-msg visible ' + type;
    setTimeout(() => {
      status.classList.remove('visible');
    }, 4000);
  }

  btn.addEventListener('click', () => {
    const email = input.value.trim();

    if (!email) {
      showStatus('Please enter your email address.', 'error');
      input.focus();
      return;
    }

    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRe.test(email)) {
      showStatus('Please enter a valid email address.', 'error');
      input.focus();
      return;
    }

    // Simulate subscription
    btn.textContent = '...';
    btn.disabled = true;

    setTimeout(() => {
      showStatus('Thank you for subscribing!', 'success');
      btn.textContent = 'Subscribed';
      btn.style.background = '#2a2a30';
      btn.style.borderColor = '#2a2a30';
      btn.style.color = '#8a857d';
      btn.style.cursor = 'default';
      input.value = '';
    }, 800);
  });

  // Submit on Enter
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });
</script>

</body>
</html>
