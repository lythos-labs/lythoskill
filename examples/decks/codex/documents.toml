# Document Format Deck (Codex)
# PDF + DOCX for Codex CLI. Uses .agents/skills/ — Codex default scan path.
#
# ⚠️  Codex #11314: symlinked .agents/skills/ is not discovered.
#     Workaround: use `deck link` to set up symlinks, then copy real dirs:
#       cp -rL .agents/skills/ .agents/skills-real/
#     Or wait for snapshot mode (ADR-20260507190157540) to land in 0.10.x.
#
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/lythos-labs/lythoskill/refs/heads/main/examples/decks/codex/documents.toml > skill-deck.toml
#   bunx @lythos/skill-deck@latest link
#   codex exec "Write a recipe as a .docx file"

[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".agents/skills"

[innate.skills.lythoskill-deck]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-deck"

[tool.skills.pdf]
path = "github.com/anthropics/skills/skills/pdf"
role = "Read and extract text from PDF files"

[tool.skills.docx]
path = "github.com/anthropics/skills/skills/docx"
role = "Read and write Word documents"
