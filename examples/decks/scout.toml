# Scout Deck
# Investigate a shared tool/repo before deciding to adopt. Intentionally thin —
# the agent's built-in web access does the heavy lifting.
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/lythos-labs/lythoskill/refs/heads/main/examples/decks/scout.toml > skill-deck.toml
#   LYTHOS_PLAYER=kimi bunx @lythos/skill-arena@latest agent-run --brief "Investigate <repo-url>" --deck ./skill-deck.toml --out ./output

[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".claude/skills"

[innate.skills.lythoskill-deck]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-deck"
