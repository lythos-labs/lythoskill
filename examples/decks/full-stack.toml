# Full-Stack Deck
# React best practices + component patterns + TDD + diagrams.
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/lythos-labs/lythoskill/refs/heads/main/examples/decks/full-stack.toml > skill-deck.toml
#   bunx @lythos/skill-deck@latest link
#   LYTHOS_PLAYER=kimi bunx @lythos/skill-arena@latest agent-run --brief "Build a todo app with React and TDD" --deck ./skill-deck.toml --out ./output

[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".claude/skills"

[innate.skills.lythoskill-deck]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-deck"

[tool.skills.react-best-practices]
path = "github.com/vercel-labs/agent-skills/skills/react-best-practices"
role = "React patterns: hooks, memo, performance"

[tool.skills.composition-patterns]
path = "github.com/vercel-labs/agent-skills/skills/composition-patterns"
role = "Component composition and architecture"

[tool.skills.tdd]
path = "github.com/mattpocock/skills/skills/engineering/tdd"
role = "Vertical-slice red-green-refactor discipline"

[tool.skills.pdf]
path = "github.com/anthropics/skills/skills/pdf"
role = "Read and extract text from PDF files"

[tool.skills.design-doc-mermaid]
path = "github.com/SpillwaveSolutions/design-doc-mermaid"
role = "Generate architecture diagrams from design docs"
