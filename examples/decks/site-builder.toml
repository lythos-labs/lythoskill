[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".claude/skills"

# Site Builder Deck — documentation site design + narrative + UX
# Discovered via: find-skills (skills.sh) → curator query → quality verify → deck add
