# lythoskill-research-archaeo: cold pool archaeology pipeline.
# Combo: Discover → Verify → Analyze → Collect.
# Source: ZK haiku subagent (curator SKILL.md only), 2026-05-20.
[deck]
name = "lythoskill-research-archaeo"

# Stage 1: Discover — scan cold pool, find/query skills, cross-ref external hubs
[tool.skills.lythoskill-curator]
path = "github.com/lythos-labs/lythoskill/packages/lythoskill-curator/skill"
[tool.skills.find-skills]
path = "github.com/vercel-labs/skills/skills/find-skills"

# Stage 2: Verify — audit SKILL.md claims, fact-check against web sources
[tool.skills.fact-checker]
path = "github.com/daymade/claude-code-skills/fact-checker"

# Stage 3: Test — sandbox arena test play on real prompts
[tool.skills.lythoskill-arena]
path = "github.com/lythos-labs/lythoskill/packages/lythoskill-arena/skill"

# Stage 4: Analyze — structured evidence gathering + A/B comparison
[tool.skills.deep-research]
path = "github.com/daymade/claude-code-skills/deep-research"
[tool.skills.product-analysis]
path = "github.com/daymade/claude-code-skills/product-analysis"

# Stage 5: Collect — link selected skills into working deck
[tool.skills.lythoskill-deck]
path = "github.com/lythos-labs/lythoskill/packages/lythoskill-deck/skill"
