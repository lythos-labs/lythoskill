# Governance Deck
# lythoskill project governance — deck + cortex + scribe + onboarding.
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/lythos-labs/lythoskill/refs/heads/main/examples/decks/governance.toml > skill-deck.toml
#   bunx @lythos/skill-deck@latest link

[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".claude/skills"

[innate.skills.lythoskill-deck]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-deck"

[innate.skills.cortex]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-project-cortex"
role = "GTD-style project governance (tasks, epics, ADRs)"

[innate.skills.scribe]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-project-scribe"
role = "Write project memory: handoffs, daily logs, lessons"

[innate.skills.onboarding]
path = "github.com/lythos-labs/lythoskill/skills/lythoskill-project-onboarding"
role = "Structured project memory onboarding"
