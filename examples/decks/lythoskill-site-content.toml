# lythoskill-site-content: long-form site content pipeline.
# Source: ZK haiku subagent (curator SKILL.md only), 2026-05-20.
[deck]
max_cards = 10
name = "lythoskill-site-content"

[combo.site]
prompt = """
Pipeline: Position → Mine → Structure → Narrative → Polish → Data.
1. Start with positioning-basics + content-idea-generator to nail strategy.
2. Interview user with writing-fragments to mine raw material.
3. Shape fragments into article structure with writing-shape.
4. Refine narrative flow with writing-beats.
5. Edit for clarity with edit-article.
6. For data-heavy sections, use data-storytelling to transform metrics into visual narrative.
"""

# Stage 1: Strategy — nail positioning before writing
[tool.skills.positioning-basics]
path = "github.com/BrianRWagner/ai-marketing-skills/positioning-basics"
[tool.skills.content-idea-generator]
path = "github.com/BrianRWagner/ai-marketing-skills/content-idea-generator"

# Stage 2: Mining — interview user for raw material
[tool.skills.writing-fragments]
path = "github.com/mattpocock/skills/skills/in-progress/writing-fragments"

# Stage 3: Structure — shape fragments into article, refine as beats
[tool.skills.writing-shape]
path = "github.com/mattpocock/skills/skills/in-progress/writing-shape"
[tool.skills.writing-beats]
path = "github.com/mattpocock/skills/skills/in-progress/writing-beats"

# Stage 4: Polish — edit for clarity, flow, compression
[tool.skills.edit-article]
path = "github.com/mattpocock/skills/skills/personal/edit-article"

# Stage 5: Data — metrics and benchmarks → visual narrative
[tool.skills.data-storytelling]
path = "github.com/rmyndharis/antigravity-skills/skills/data-storytelling"
