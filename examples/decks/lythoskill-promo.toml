# lythoskill-promo: Twitter/LinkedIn promotion pipeline.
# Source: ZK haiku subagent (curator SKILL.md only), 2026-05-20.
[deck]
max_cards = 10
name = "lythoskill-promo"

[combo.promo]
prompt = """
Pipeline: Position → Draft → Review → Polish → Publish.
1. When promoting a project, start with positioning-basics to define ICP + differentiation.
2. Feed positioning output to content-idea-generator for content ideas.
3. Draft platform variants with social-card-gen (Twitter/X, LinkedIn, Reddit).
4. Review with tweet-draft-reviewer (8 voice rules). Polish with de-ai-ify + voice-extractor.
5. Publish via baoyu-post-to-x (Chrome browser → X/Twitter).
"""

# Stage 1: Strategy — define ICP, differentiation, value prop
[tool.skills.positioning-basics]
path = "github.com/BrianRWagner/ai-marketing-skills/positioning-basics"
[tool.skills.content-idea-generator]
path = "github.com/BrianRWagner/ai-marketing-skills/content-idea-generator"

# Stage 2: Draft — one source → platform-optimized variants
[tool.skills.social-card-gen]
path = "github.com/BrianRWagner/ai-marketing-skills/social-card-gen"

# Stage 3: Review + Polish — 8 voice rules, de-AI, authentic voice
[tool.skills.tweet-draft-reviewer]
path = "github.com/BrianRWagner/ai-marketing-skills/tweet-draft-reviewer"
[tool.skills.de-ai-ify]
path = "github.com/BrianRWagner/ai-marketing-skills/de-ai-ify"
[tool.skills.voice-extractor]
path = "github.com/BrianRWagner/ai-marketing-skills/voice-extractor"

# Stage 4: Publish — Chrome browser → X/Twitter
[tool.skills.baoyu-post-to-x]
path = "github.com/JimLiu/baoyu-skills/skills/baoyu-post-to-x"
