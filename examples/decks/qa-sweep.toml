[deck]
max_cards = 10
cold_pool = "~/.agents/skill-repos"
working_set = ".claude/skills"

# QA Security Sweep Deck — 7 security audit skills
# Usage: arena single --deck qa-sweep.toml --brief "audit <target>"
# Combo workflow: see qa-sweep-COMBO.md

