# Arena: does adding research improve output? Is PDF dead weight?
#
# Three-way Pareto comparison:
# - base.toml: documents baseline (PDF + DOCX)
# - plus-research.toml: base + deep research pipeline
# - minus-pdf.toml: base - PDF (only DOCX)
#
# Usage:
#   bunx @lythos/skill-arena@latest vs --config arena.toml
#   bunx @lythos/skill-arena@latest vs --config arena.toml --dry-run
#
# The "player" field below is your AI agent backend.
# Change to whatever you have installed locally:
#   player = "kimi"    # Kimi Code CLI (default, recommended)
#   player = "claude"  # Claude Code CLI (npm i -g @anthropic-ai/claude-code)
#   player = "deepseek"   # DeepSeek TUI (pip install deepseek-tui)

[arena]
task = "./TASK.md"
criteria = ["depth", "relevance", "structure", "token"]
runs_per_side = 1

[[side]]
name = "base-documents"
player = "kimi"
deck = "../../decks/arena-add-remove/base.toml"

[[side]]
name = "plus-research"
player = "kimi"
deck = "../../decks/arena-add-remove/plus-research.toml"

[[side]]
name = "minus-pdf"
player = "kimi"
deck = "../../decks/arena-add-remove/minus-pdf.toml"
