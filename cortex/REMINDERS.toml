# cortex/REMINDERS.toml — session 级提醒的声明式 registry(条目 SSOT,机读)
# 协议/由来/并发 lease 锁=见 cortex/REMINDERS.md(先读它再改本表)
# reconcile:入场读本表 → CronList 对照(按 prompt 内嵌字面量 R-id 匹配)→ 缺员按条目 CronCreate(cron/prompt 照抄)
# 字段:id / cron(5 字段,避 :00/:30) / recurring(false=一次性,pinned 日期) / expires(失效条件,命中即退役) / prompt(零上下文可执行:任务+指针+Done+别重做,≤8KiB)
# 退役:删条目 + REMINDERS.md 留退役记录;id 不复用。
# 2026-10-13 起自用于本仓(TASK-20261013153805367,ADR-20261013143648588 follow-up)。
# 不挂 entropy-check:pre-push 钩子已按 7 天间隔自管(2026-10-13 实证),再挂=重做。

[[reminder]]
id = "R0"
cron = "33 8 * * *"
recurring = true
expires = "无常设 heartbeat=lease 续租,退役=机制本身废弃"
prompt = """R0 heartbeat(R0,registry=cortex/REMINDERS.toml;协议=cortex/REMINDERS.md「并发协议」节):读 .reminders-owner.lock/owner.json——①锁属本 session 且在租:把 lease_until 刷成 now+3 天,把当前 ISO 时间戳写进 .reminders-owner.lock/last-heartbeat(fork/clear 再确认要读的活性证据),顺手 CronList 按 cortex/REMINDERS.toml 补挂缺员,完事(无 chat 输出);②锁属他 session 且在租且 last-heartbeat 新鲜(2×R0 周期内):用 CronDelete 删掉自己所有 R 系 cron(自我清场),不再行动;③锁不存在/已过期/他主 last-heartbeat 过期(fork/clear 僵尸):mkdir 抢占或重写 owner.json、重挂在册提醒,然后在 daily 落一行「R0 接管锁(原因)」。"""

[[reminder]]
id = "R1"
cron = "11 21 * * 0"
recurring = true
expires = "scribe-weekly 被自动化取代"
prompt = """weekly 复盘(R1,registry=cortex/REMINDERS.toml):调用 lythoskill-project-scribe-weekly skill,对过去 7 天 daily 做主线+quest DAG 蒸馏,落 weekly 文件。Done=weekly 文件 commit。别重做:不回放 git log / cortex INDEX(那些是下个 agent 可直接查询的,weekly 只写蒸馏增量与模式)。"""

[[reminder]]
id = "R2"
cron = "47 9 * * 1"
recurring = true
expires = "probe 连续两周 0 issue 且机制判稳→可降双周频(改表即生效)"
prompt = """probe 漂移周清扫(R2,registry=cortex/REMINDERS.toml):跑 bun packages/lythoskill-project-cortex/src/cli.ts probe,对 issue 逐类处置:①stale backlog:>7 天的,能关则 cortex complete/terminate(附 git log 证据),该留的注明原因;②epic drift(活动 epic 与任务实况不符)按实况 epic done/suspend;③wiki 结构漂移:按 config 对齐修(config.ts wikiSubdirs 参照真实目录);④新类问题先落 daily 再开卡。Done=daily 里一行「probe 清扫:N issues → M(处置摘要)」。别重做:不重造检查项(probe 自己的判据就是清单);绝不手 mv 卡(一律 CLI,FSM 会拒非法迁移)。""""
