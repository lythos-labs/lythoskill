name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: All package unit tests
        run: bun --filter='*' run test
      - name: cortex BDD
        run: bun packages/lythoskill-project-cortex/test/runner.ts
      - name: deck BDD
        run: bun packages/lythoskill-deck/test/runner.ts
      - name: validate example decks
        run: bun scripts/validate-example-decks.ts
      - name: site deck snippets stay within validated decks
        run: bun scripts/check-site-deck-snippets.ts
      - run: bun packages/lythoskill-creator/src/cli.ts align
      - name: test report
        if: always()
        run: bun scripts/test-report.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results/

  # Site content is user-facing — a broken VitePress build must fail the
  # commit that caused it, in the workflow everyone watches. Deploy stays
  # in deploy-pages.yml; here we only prove the site builds.
  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Site bunx commands match the real CLIs
        run: bun scripts/check-site-commands.ts
      - name: Install site dependencies
        working-directory: site
        run: bun install
      - name: Inject site version metadata
        working-directory: site
        run: bun scripts/inject-version.ts
      - name: Inject site stats
        working-directory: site
        run: bun scripts/inject-stats.ts
      - name: Build VitePress
        working-directory: site
        run: bun vitepress build . --outDir .vitepress/dist
      # A hard-coded stale number in the md sources would fail this grep:
      # the built HTML must carry the CURRENT deck count, in both locales.
      - name: Built HTML carries the current deck count (EN+ZH)
        run: |
          DECKS=$(ls examples/decks/*.toml | wc -l | tr -d ' ')
          grep -q "Browse all $DECKS example decks" site/.vitepress/dist/index.html
          grep -q "瀏覽全部 $DECKS 副範例牌組" site/.vitepress/dist/zh/index.html

  coverage-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --filter=@lythos/skill-deck run test
      - run: bun --filter=@lythos/skill-deck run test:coverage || true
      - uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
        if: github.event_name == 'pull_request'
        with:
          lcov-path: packages/lythoskill-deck/coverage/lcov.info
          min-coverage: 0

  coverage-cold-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --filter=@lythos/cold-pool run test
      - run: bun --filter=@lythos/cold-pool run test:coverage || true
      - uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
        if: github.event_name == 'pull_request'
        with:
          lcov-path: packages/lythoskill-cold-pool/coverage/lcov.info
          min-coverage: 0

  coverage-test-utils:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun --filter=@lythos/test-utils run test
      - run: bun --filter=@lythos/test-utils run test:coverage || true
      - uses: 70-10/bun-coverage-report-action@6173866ce2a31456a726ff3f4c91f230bd94a9e9 # v1.0.3
        if: github.event_name == 'pull_request'
        with:
          lcov-path: packages/lythoskill-test-utils/coverage/lcov.info
          min-coverage: 0
