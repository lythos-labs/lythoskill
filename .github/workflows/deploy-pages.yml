name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cortex/wiki/**'
      - 'cortex/adr/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: site
        run: bun install

      - name: Inject site version metadata
        working-directory: site
        run: bun scripts/inject-version.ts

      - name: Inject site stats
        working-directory: site
        run: bun scripts/inject-stats.ts

      - name: Build VitePress
        working-directory: site
        run: bun vitepress build . --outDir .vitepress/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
