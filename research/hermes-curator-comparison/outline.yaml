topic: "Hermes Curator vs lythoskill Curator — Comparative Analysis of Skill Curation Approaches"
items:
  - name: "Hermes Curator"
    description: "Nous Research's background maintenance system for agent-created skills. Lifecycle management (active→stale→archived), LLM review, telemetry-based decisions."
  - name: "lythoskill Curator"
    description: "lythos-labs' read-only skill indexer. Scans cold pools, extracts frontmatter, generates REGISTRY.json + catalog.db for structured discovery."
  - name: "agentskills.io Open Standard"
    description: "The open skill standard that Hermes adopts. Portable SKILL.md format compatible with Claude Code, Cursor, Codex, etc."
  - name: "Hermes Skills System"
    description: "Hermes' overall skill architecture: bundled vs hub-installed vs agent-created skills, external_dirs, ~/.hermes/skills/ layout."
  - name: "lythoskill Deck + Arena Ecosystem"
    description: "The governance layer context: deck declares skills, arena tests skills, curator discovers skills. Three-layer trust model."
  - name: "Skill Lifecycle Management Patterns"
    description: "Industry patterns for managing agent skills over time: curation, archival, deprecation, versioning."
execution:
  batch_size: 3
  items_per_agent: 2
  output_dir: ./results
